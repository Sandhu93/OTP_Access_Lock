services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: access_lock
      POSTGRES_USER: access_lock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - access_lock_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access_lock -d access_lock"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]

  api:
    build: ./backend
    environment:
      DJANGO_DEV_MODE: "0"
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DATABASE_URL: postgresql://access_lock:${POSTGRES_PASSWORD}@db:5432/access_lock
      REDIS_URL: redis://redis:6379/0
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
      KMS_KEY_ID: ${KMS_KEY_ID:?set KMS_KEY_ID}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:?set MQTT_BROKER_URL}
      OTP_DELIVERY_PROVIDER: ${OTP_DELIVERY_PROVIDER:?set OTP_DELIVERY_PROVIDER}
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn access_lock.wsgi:application --bind 0.0.0.0:8000 --workers 2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  dashboard:
    build: ./dashboard
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  access_lock_db:

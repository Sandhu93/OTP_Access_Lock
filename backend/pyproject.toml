[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "access-lock-backend"
version = "0.1.0"
description = "Django control plane for the Access Lock split-trust locker system"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6.0",
  "djangorestframework>=3.15,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "dj-database-url>=2.2,<3.0",
  "django-cors-headers>=4.7,<5.0",
  "redis>=5.0,<6.0",
  "paho-mqtt>=2.1,<3.0",
  "gunicorn>=23.0,<24.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "google-auth>=2.33,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.9", "ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
